name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the code. No logins, no secrets.
permissions:
  contents: read

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "ingestion/uv.lock"
      - name: ruff check
        run: uvx ruff@0.14.5 check ingestion
      - name: ruff format
        run: uvx ruff@0.14.5 format --check ingestion
      - name: pytest
        working-directory: ingestion
        run: |
          uv sync --locked          # fails if uv.lock doesn't match pyproject.toml
          uv run pytest -q

  sql-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: sqlfluff lint
        run: uvx --from sqlfluff==3.5.0 sqlfluff lint dbt/models dbt/tests dbt/macros

  dbt-parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: "dbt/uv.lock"
      # A parse-only profile. `dbt parse` needs a profile to start but never connects, so the values
      # are dummies. Nothing here is a secret, and nothing is committed.
      # Outside the repo: profiles.yml is gitignored everywhere, so CI writes its own. Set here and not in the
      # job's env: block, because the runner context (runner.temp) isn't available there. That mistake made
      # the whole workflow invalid, so GitHub ran no checks at all for PR #2-#10.
      - name: Write parse-only dbt profile
        run: |
          DBT_PROFILES_DIR="$RUNNER_TEMP/dbt-profiles"
          echo "DBT_PROFILES_DIR=$DBT_PROFILES_DIR" >> "$GITHUB_ENV"   # for the steps after this one
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'EOF'
          regnskap:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: lakehouse_dev
                schema: silver
                host: parse-only.invalid
                http_path: /sql/1.0/warehouses/parse-only
                token: parse-only
                threads: 1
          EOF
      - run: uv sync --locked
      - run: uv run dbt deps
      - run: uv run dbt parse --no-partial-parse

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.0"   # same as your local version
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra
      - name: terraform validate
        run: |
          for dir in infra/01-azure infra/02-databricks; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}   # tflint --init downloads plugins from GitHub; avoids rate limits
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --chdir=infra --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  # The Databricks job's pinned packages (infra/02-databricks/jobs.tf) must match the lock files, so the job
  # runs exactly what the tests run. Catches a Dependabot/uv lock update that forgot the job.
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Job pins == uv.lock
        run: python3 ci/check_pins.py

  # The ONLY check branch protection requires. New jobs are added to `needs` here,
  # and branch protection never has to change.
  ci-ok:
    if: always()
    needs: [python, sql-lint, dbt-parse, terraform, pins]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed?
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
