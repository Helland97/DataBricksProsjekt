name: terraform-plan

# `terraform plan` for both modules on every PR that touches infra/, as the CI service principal
# (Entra OIDC, read-only Azure roles). Posts a summary as a PR comment. Never applies: apply stays local.
# STEG5-PLAN.md section 7.5. Runs on every PR for the same reason as dbt-pr.yml (required checks).
on:
  pull_request:

permissions:
  contents: read
  id-token: write # OIDC login to Azure
  pull-requests: write # the plan comment

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
              | grep -qE '^(infra/|\.github/workflows/terraform-plan\.yml$)'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: changes
    if: >-
      needs.changes.outputs.infra == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    environment: ci
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # What terraform.tfvars gives you locally. CI must plan with the same inputs, or every plan shows
      # changes that aren't real (grants destroyed, the alert e-mail removed).
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ci_principal: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS }} # a JSON list, e.g. ["you@example.com"]; sensitive in Terraform
    steps:
      - uses: actions/checkout@v4
      # Same login as `az login` locally, so the azurerm backend, azurerm and the Databricks provider all use it.
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: terraform plan (01-azure, then 02-databricks, which reads 01's state)
        id: plan
        run: |
          status=0
          : > plan.txt
          for module in 01-azure 02-databricks; do
            echo "::group::$module"
            terraform -chdir="infra/$module" init -no-color > /dev/null
            set +e
            terraform -chdir="infra/$module" plan -no-color -lock-timeout=5m -detailed-exitcode > "plan-$module.txt" 2>&1
            rc=$?
            set -e
            cat "plan-$module.txt"
            echo "::endgroup::"
            # -detailed-exitcode: 0 = no changes, 2 = changes (fine for a PR), 1 = error
            [ "$rc" -eq 1 ] && status=1
            {
              echo "#### \`$module\`"
              # The summary: one line per changed resource, the totals, and any errors. Full plan in the job log.
              grep -E '^  # |^Plan:|^No changes|Error' "plan-$module.txt" || echo "(no summary lines, see the job log)"
              echo
            } >> plan.txt
          done
          exit "$status"

      - name: Comment the summary on the PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            let summary = fs.existsSync("plan.txt") ? fs.readFileSync("plan.txt", "utf8") : "(no plan output)";
            if (summary.length > 60000) summary = summary.slice(0, 60000) + "\n... (cut, see the job log)";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n### Terraform plan: ${process.env.OUTCOME}\n\n` +
              "```\n" + summary + "\n```\n" + `Full plan: [job log](${run}). Apply stays local.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // One comment per PR, updated on every push, instead of a new one each time.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === "Bot" && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  terraform-plan-ok:
    if: always()
    needs: [changes, plan]
    runs-on: ubuntu-latest
    steps:
      - name: Did everything pass (or get skipped)?
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
