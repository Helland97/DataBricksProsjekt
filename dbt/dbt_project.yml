name: regnskap
version: "0.1.0"
profile: regnskap

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  regnskap:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: silver
      +materialized: table
    intermediate:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table

snapshots:
  regnskap:
    +schema: silver

seeds:
  regnskap:
    +schema: silver

data_tests:
  regnskap:
    +store_failures: true
    +schema: audit

vars:
  ar_account_no: 1500     # kundefordringer (NS 4102)
  bank_account_no: 1920   # bankinnskudd (NS 4102): a debit here + AR credit = customer payment
  as_of_date: null        # null = latest entry_date in the data; override with --vars
  snapshot_time: null     # replay only: simulated date for snapshot versions. null = current_timestamp()
