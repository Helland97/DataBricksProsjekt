unit_tests:
  - name: test_rpt_ar_aging_bucket_boundaries
    description: "Boundary values: 0 = not_due, 30 = 1-30, 31 = 31-60, 60/61, 90 = 61-90, 91 = 90+."
    model: rpt_ar_aging
    given:
      - input: ref('int_ar_open_items')
        rows:
          - {invoice_id: 1, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 2, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 3, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 4, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 5, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 6, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 7, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 8, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
          - {invoice_id: 9, customer_id: 10, as_of_date: "2026-10-31", open_amount: 100, is_open: true}
      - input: ref('fct_invoices')
        rows:
          - {invoice_id: 1, invoice_date: "2026-10-20", due_date: "2026-11-05"}   # -5
          - {invoice_id: 2, invoice_date: "2026-10-01", due_date: "2026-10-31"}   #  0
          - {invoice_id: 3, invoice_date: "2026-10-01", due_date: "2026-10-30"}   #  1
          - {invoice_id: 4, invoice_date: "2026-09-01", due_date: "2026-10-01"}   # 30
          - {invoice_id: 5, invoice_date: "2026-09-01", due_date: "2026-09-30"}   # 31
          - {invoice_id: 6, invoice_date: "2026-08-01", due_date: "2026-09-01"}   # 60
          - {invoice_id: 7, invoice_date: "2026-08-01", due_date: "2026-08-31"}   # 61
          - {invoice_id: 8, invoice_date: "2026-07-01", due_date: "2026-08-02"}   # 90
          - {invoice_id: 9, invoice_date: "2026-07-01", due_date: "2026-08-01"}   # 91
      - input: ref('dim_customers')
        rows:
          - {customer_id: 10, customer_name: "Test AS", is_current: true}
    expect:
      rows:
        - {invoice_id: 1, days_past_due: -5, aging_bucket: "not_due"}
        - {invoice_id: 2, days_past_due: 0,  aging_bucket: "not_due"}
        - {invoice_id: 3, days_past_due: 1,  aging_bucket: "1-30"}
        - {invoice_id: 4, days_past_due: 30, aging_bucket: "1-30"}
        - {invoice_id: 5, days_past_due: 31, aging_bucket: "31-60"}
        - {invoice_id: 6, days_past_due: 60, aging_bucket: "31-60"}
        - {invoice_id: 7, days_past_due: 61, aging_bucket: "61-90"}
        - {invoice_id: 8, days_past_due: 90, aging_bucket: "61-90"}
        - {invoice_id: 9, days_past_due: 91, aging_bucket: "90+"}
