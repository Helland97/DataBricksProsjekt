unit_tests:
  - name: test_parse_nok_amount_in_stg_erp__invoices
    description: "Text amounts from the day 15 type change are parsed back to decimals. Real numbers pass through unchanged."
    model: stg_erp__invoices
    overrides:
      macros:
        is_incremental: false
        # The fixture defines every column itself, so don't ask the real bronze (macros/source_columns.sql)
        source_has_column: true
    given:
      # format: sql, not rows. With `rows`, dbt checks the fixture's columns against the REAL bronze table,
      # and before the day 15 schema change bronze has no amount_incl_vat__v_text, so the test can't even
      # start. A SQL fixture defines all columns and types itself and works on any day.
      - input: source('erp', 'invoices')
        format: sql
        rows: |
          select * from values
            (1, 10, '2026-10-15', '2026-10-29', 29857.60d, cast(null as double), cast(null as double), '37 322,00',
             'sent', 'NOK', null, timestamp'2026-10-15 10:00:00', 'a1', '1794900000.1'),
            (2, 10, '2026-10-15', '2026-10-29', 987.60d, cast(null as double), cast(null as double), '1 234,50',
             'sent', 'NOK', null, timestamp'2026-10-15 10:00:00', 'a2', '1794900000.1'),
            (3, 10, '2026-10-15', '2026-10-29', 400.00d, 100.00d, 500.00d, cast(null as string),
             'sent', 'NOK', null, timestamp'2026-10-15 10:00:00', 'a3', '1794900000.1')
          as t(invoice_id, customer_id, invoice_date, due_date, amount_ex_vat, vat_amount, amount_incl_vat,
               amount_incl_vat__v_text, status, currency, kid, updated_at, _dlt_id, _dlt_load_id)
    expect:
      rows:
        - {invoice_id: 1, amount_incl_vat: 37322.00, is_amount_parsed_from_text: true}
        - {invoice_id: 2, amount_incl_vat: 1234.50,  is_amount_parsed_from_text: true}
        - {invoice_id: 3, amount_incl_vat: 500.00,   is_amount_parsed_from_text: false}
