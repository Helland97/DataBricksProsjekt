# Install once:  uv tool install pre-commit   then   pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.5.0
    hooks:
      - id: sqlfluff-lint
        files: ^dbt/(models|tests|macros)/.*\.sql$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]           # parse syntax only: dbt YAML is fine, but the custom tags in some files aren't
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      # An invalid workflow doesn't fail loudly: GitHub just runs no checks. Catch it before the commit.
      - id: actionlint
        name: actionlint (GitHub workflows)
        entry: uvx --from actionlint-py==1.7.12.25 actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive infra
        language: system
        files: \.tf$
        pass_filenames: false
