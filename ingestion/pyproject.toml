[project]
name = "regnskap-ingestion"
version = "0.1.0"
description = "Synthetic accounting data, a fake source and dlt pipelines into bronze."
requires-python = ">=3.12"
dependencies = [
    "dlt[databricks,duckdb]>=1.32.0",
    "faker>=30",
    "fastapi>=0.162.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
