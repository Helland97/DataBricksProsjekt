# Ruff: lint and format all Python in the repo (ingestion/, later ci/).
# Ruff ignores ingestion/pyproject.toml because it has no [tool.ruff] table, so this file applies.
target-version = "py312"
line-length = 120

[lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear (likely bugs), UP newer Python syntax
select = ["E", "F", "W", "I", "B", "UP"]

[lint.per-file-ignores]
# Databricks notebooks: spark, dbutils and display are injected by the runtime, and imports come after %pip cells
"ingestion/notebooks/*" = ["F821", "E402"]

[lint.flake8-bugbear]
# dlt's documented idiom: `updated_at = dlt.sources.incremental(...)` as a default argument. Not a bug here.
extend-immutable-calls = ["dlt.sources.incremental"]

[format]
# The notebook is also edited in the Databricks UI. Formatting it here would fight the UI on every save.
exclude = ["ingestion/notebooks/*"]
